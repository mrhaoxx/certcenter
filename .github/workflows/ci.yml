name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The SPA is type-checked and built on its own first so a frontend
      # error shows up here with a readable message rather than deep inside
      # a Docker layer.
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Vet
        run: go vet ./...

      # CGO_ENABLED=0 is the production build mode (pure-Go SQLite); the
      # tests run the same way so nothing cgo-only can sneak in. Pebble runs
      # in-process, so the suite needs no network.
      - name: Test
        run: CGO_ENABLED=0 go test ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/certcenter

      - uses: azure/setup-helm@v4

      # Lint and render the chart against each fixture under charts/certcenter/ci
      # so a template error fails here, not at the first helm install.
      - name: Lint chart
        run: |
          for f in charts/certcenter/ci/*-values.yaml; do
            helm lint charts/certcenter -f "$f"
            helm template ci charts/certcenter -f "$f" > /dev/null
          done

  image:
    name: Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main      -> latest + sha-<short>
      # tag v1.2.3 -> v1.2.3, v1.2, sha-<short>  (no latest on tags: a
      #               backport tag must not overwrite the newest main)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Chart
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Chart version = tag without the v; appVersion = the tag, which is
      # also the image tag the chart pulls by default.
      - name: Package and push
        run: |
          tag="${GITHUB_REF_NAME}"
          helm package charts/certcenter --version "${tag#v}" --app-version "$tag" -d dist
          helm push "dist/certcenter-${tag#v}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
