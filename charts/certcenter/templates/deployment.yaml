{{- $root := .Values.localDeploy.runAsRoot -}}
{{- $fixData := and (eq .Values.persistence.type "hostPath") .Values.persistence.hostPath.fixPermissions (not $root) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "certcenter.fullname" . }}
  labels:
    {{- include "certcenter.labels" . | nindent 4 }}
spec:
  # SQLite is single-writer: exactly one pod, and the old one must be gone
  # before the new one opens the database.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "certcenter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "certcenter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if not .Values.existingSecret }}
        # Roll the pod when the rendered config changes.
        checksum/config: {{ include "certcenter.configToml" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "certcenter.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- if $root }}
        {{- /* localDeploy.runAsRoot: files written to host directories must be root-owned.
               Built with set rather than merge: Sprig's merge treats 0 and false as empty
               and would let the non-root values win. */}}
        {{- $sc := omit .Values.podSecurityContext "fsGroup" "runAsUser" "runAsGroup" "runAsNonRoot" }}
        {{- $_ := set $sc "runAsUser" 0 }}
        {{- $_ := set $sc "runAsGroup" 0 }}
        {{- $_ := set $sc "runAsNonRoot" false }}
        {{- toYaml $sc | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- end }}
      {{- if $fixData }}
      initContainers:
        # A freshly created hostPath directory is root-owned; hand
        # CertCenter's own data directory to the uid it runs as. Only this
        # directory is touched, and only this step runs as root.
        - name: chown-data
          image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
          imagePullPolicy: {{ .Values.initImage.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          command:
            - chown
            - "{{ .Values.podSecurityContext.runAsUser }}:{{ .Values.podSecurityContext.runAsGroup }}"
            - /data
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: certcenter
          image: {{ include "certcenter.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- if $root }}
            {{- /* Root with every capability dropped still cannot write into a directory
                   owned by another user (haproxy:haproxy 0750, say); keep the three that
                   make root able to drop a file anywhere on the host. */}}
            {{- $csc := deepCopy .Values.securityContext }}
            {{- $caps := default (dict) $csc.capabilities }}
            {{- $_ := set $caps "add" (concat (default (list) $caps.add) (list "DAC_OVERRIDE" "CHOWN" "FOWNER") | uniq) }}
            {{- $_ := set $csc "capabilities" $caps }}
            {{- toYaml $csc | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.securityContext | nindent 12 }}
            {{- end }}
          args:
            - -config
            - /etc/certcenter/config.toml
            {{- with (include "certcenter.externalUrl" .) }}
            - -external-url
            - {{ . | quote }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/certcenter
              readOnly: true
            - name: data
              mountPath: /data
            {{- range .Values.localDeploy.hostPaths }}
            - name: local-{{ .name }}
              mountPath: {{ .mountPath | quote }}
            {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "certcenter.configSecretName" . }}
            items:
              - key: config.toml
                path: config.toml
        - name: data
          {{- if eq .Values.persistence.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.pvc.existingClaim | default (printf "%s-data" (include "certcenter.fullname" .)) }}
          {{- else if eq .Values.persistence.type "hostPath" }}
          hostPath:
            path: {{ .Values.persistence.hostPath.path | quote }}
            type: {{ .Values.persistence.hostPath.type }}
          {{- else if eq .Values.persistence.type "emptyDir" }}
          emptyDir: {}
          {{- else }}
          {{- fail (printf "persistence.type must be pvc, hostPath or emptyDir, got %q" .Values.persistence.type) }}
          {{- end }}
        {{- range .Values.localDeploy.hostPaths }}
        - name: local-{{ .name }}
          hostPath:
            path: {{ required "localDeploy.hostPaths[].hostPath is required" .hostPath | quote }}
            type: {{ .type | default "DirectoryOrCreate" }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
